<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected – Social-Publisher</title><link rel="icon" href="/icon.png">
<style>*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#1c2033;display:grid;place-items:center;min-height:100vh;padding:20px}
.c{max-width:560px;width:100%;background:#fff;border:1px solid #e6e8f0;border-radius:20px;padding:32px;box-shadow:0 18px 40px -24px rgba(79,70,229,.5)}
.h{background:linear-gradient(135deg,#4f46e5,#7c3aed,#ec4899);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:18px;font-weight:800;font-size:20px}
p{color:#555b70;font-size:15px;line-height:1.6;margin-bottom:14px}textarea{width:100%;height:110px;border:1px solid #d9dce8;border-radius:12px;padding:12px;font:13px ui-monospace,monospace;resize:none}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.ok{color:#16a34a;font-weight:600;margin-top:10px;display:none}</style></head>
<body><div class="c"><div class="h">✓ Account connected</div>
<p>Authorization finished. Copy the full address below and send it to the Social-Publisher owner to complete the connection.</p>
<textarea id="u" readonly></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('u').value);document.getElementById('k').style.display='block'">Copy</button>
<div class="ok" id="k">Copied!</div></div>
<script>document.getElementById('u').value=location.href</script></body></html>
